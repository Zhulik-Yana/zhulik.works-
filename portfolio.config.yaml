# ── Аналитика (необязательно, всегда бесплатно) ─────────────────────────
# Два способа отслеживать посетителей — оба бесплатны, без карты:
#
# 1. Встроенная статистика GitHub (без настройки — уже там!)
#    Зайдите в репозиторий → Insights → Traffic.
#    Показывает уникальных посетителей, просмотры и источники за 14 дней.
#
# 2. GoatCounter (больше деталей, приватный, бесплатный для личного использования)
#    Зарегистрируйтесь на https://www.goatcounter.com — получите короткий код, например "janedoe"
#    Раскомментируйте две строки ниже и замените "yourcode" на свой код GoatCounter:
#
# analytics:
#   goatcounterCode: "yourcode"

# ── Блог ───────────────────────────────────────────────────────────────
# Положите любой .md файл в папку blog/ — он автоматически станет постом.
# Каждый пост начинается с блока "frontmatter" (между ---):
#
#   ---
#   title: "Название поста"
#   date: "2025-01-15"
#   tags: [жизнь, технологии]
#   excerpt: "Одно предложение для страницы со списком."
#   ---
#
# Затем пишите пост на чистом Markdown ниже закрывающих ---.
# Смотрите примеры постов в папке blog/ для начала.
blog:
  enabled: true
  title: "Blog"
  description: "Thoughts, stories and ideas — everything in one place."
