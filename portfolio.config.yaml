# ╔══════════════════════════════════════════════════════════════════════╗
# ║              GitVitae — Конфигурация портфолио                        ║
# ║  Это единственный файл, который нужно редактировать.                 ║
# ║  Запустите  pnpm check-config  чтобы проверить ошибки до публикации. ║
# ╚══════════════════════════════════════════════════════════════════════╝

# ╔══════════════════════════════════════════════════════════════════════╗
# ║  ** ПЕРВОЕ, ЧТО НУЖНО ИЗМЕНИТЬ **                                     ║
# ║                                                                      ║
# ║  siteMode: "landing"  → показывает вступительную страницу GitVitae   ║
# ║  siteMode: "portfolio" → показывает ВАШЕ портфолио                   ║
# ║                                                                      ║
# ║  Измените на "portfolio", когда заполните свои данные.               ║
# ╚══════════════════════════════════════════════════════════════════════╝
siteMode: "landing"   # ← ИЗМЕНИТЕ ЭТО на "portfolio"
siteUrl:  "https://yourusername.github.io"  # ← Ваш URL на GitHub Pages (для RSS и канонических ссылок)
showPoweredBy: false  # Поставьте true, чтобы показать значок "Made with GitVitae" в подвале

# ── Личные данные ─────────────────────────────────────── (обязательно) ──
name: "Яна"              # Ваше имя — показывается в шапке и используется для аватара
title: "Portfolio-Resume Engineer"
tagline: "I build free portfolios and resumes for everyone."
email: "git-vitae@proton.me"
phone: ""                    # Необязательно — например, "+375 (29) 000-00-00". Показывается в контактах и резюме.
location: "Беларусь"
avatarUrl: "https://api.dicebear.com/9.x/fun-emoji/svg?seed=Alex&mouth[]=wideSmile&radius=12"  # Демо-аватар — замените на ссылку на своё фото (см. инструкцию ниже)
# Как добавить своё фото (бесплатно, без лишних аккаунтов):
#   1. Зайдите в свой репозиторий на GitHub → "Add file" → "Upload files"
#   2. Загрузите фото (например, avatar.jpg) в папку "public/"
#   3. После сохранения откройте файл на GitHub и скопируйте прямую ссылку (raw URL):
#      https://raw.githubusercontent.com/ВАШ_НИК/ваш-репозиторий/main/public/avatar.jpg
#   4. Вставьте эту ссылку сюда.
# Оставьте пустым, чтобы показывались ваши инициалы.

# ── Скачивание резюме ──────────────────────────────────────────────────
# Необязательно: прямая ссылка на PDF (Google Drive, Dropbox и т.д.)
# Если оставить пустым, кнопка "Resume" откроет встроенную страницу резюме,
# где посетители смогут нажать "Save PDF" и сохранить свою копию.
#
# Как получить прямую ссылку:
#   1. Зайдите на /resume в своём портфолио, нажмите "Save PDF" → сохраните файл
#   2. Загрузите этот PDF в Google Drive / Dropbox и скопируйте прямую ссылку
#   3. Вставьте ссылку ниже и обновите resumeFileName
#
# resumeUrl: "https://drive.google.com/uc?export=download&id=ВАШ_ID_ФАЙЛА"
# resumeFileName: "Git_Vitae_Resume.pdf"

# ── Статус ─────────────────────────────────────────────────────────────
openToWork: true         # Показывает баннер "Open to Opportunities", если true

# ── Тема оформления ────────────────────────────────────────────────────
defaultTheme: "system"   # Варианты: light | dark | system
colorPreset: "indigo"    # Варианты: indigo | emerald | rose | amber | ocean | slate | custom
# primaryColor: "#6366f1" # Необязательно — вставьте свой hex-код цвета.
                           # Переопределяет colorPreset выше. Как найти hex-код:
                           #   → Google "color picker", выберите цвет, скопируйте 6-значный код (например, #e11d48)
                           #   → или возьмите на coolors.co / любимом сайте

resumeTheme:
  twoColumn: "indigo"    # Акцентный цвет для двухколоночного резюме
  classic: "emerald"     # Акцентный цвет для классического резюме

contactFormEndpoint: ""  # Необязательно — вставьте URL Formspree (https://formspree.io/f/xxxx)
                           # или любой POST-эндпоинт, принимающий {name, email, message}.
                           # Оставьте пустым, чтобы использовать mailto: ссылку.

# ── Видимость разделов ─────────────────────────────────────────────────
# Поставьте show: false, чтобы скрыть любой раздел
sections:
  - { id: about,          show: true  }
  - { id: stats,          show: false }  # Статистика уже показывается карточками в разделе "О себе" — включите, только если хотите отдельный полноширинный блок
  - { id: skills,         show: true  }
  - { id: languages,      show: true  }
  - { id: experience,     show: true  }
  - { id: projects,       show: true  }
  - { id: education,      show: true  }
  - { id: certifications, show: true  }
  - { id: publications,   show: false }
  - { id: testimonials,   show: true  }
  - { id: contact,        show: true  }

# ── Соцсети ──────────────────────────────────── (пусто = скрыто) ───────
social:
  github:   "https://github.com/yourusername"
  linkedin: "https://linkedin.com/in/yourusername"
  twitter:  ""
  website:  ""

# ── О себе ─────────────────────────────────────────────────────────────
# Используйте | для многострочного текста. Каждую строку с отступом в 2 пробела.
about: |
  Я — инженер портфолио и резюме с опытом более 5 лет, создаю продукты,
  которые нравятся людям. Специализируюсь на React, Node.js и распределённых
  системах. Когда не пишу код, гуляю по горным тропам или экспериментирую
  с новыми способами заваривания кофе.


# ── Статистика ─────────────────────────────────────────────────────────
# Настройте каждую метку и значение — замените "Projects Shipped" на
# "Активные клиенты", "Довольные клиенты", "Звёзды на GitHub" и т.д.
# Необязательные поля: prefix (например, "$") и suffix (например, "+" или "k").
# Удалите все записи или поставьте show: false выше, чтобы скрыть раздел.
stats:
  - { label: "Years Experience", value: 5,    suffix: "+" }
  - { label: "Projects Shipped", value: 20,   suffix: "+" }
  - { label: "Happy Clients",    value: 50,   suffix: "+" }
  - { label: "Cups of Coffee",   value: 1200, suffix: ""  }

# Примеры других комбинаций:
#   - { label: "Active Users",    value: 10000, suffix: "+" }
#   - { label: "Revenue",         value: 2,     prefix: "$", suffix: "M+" }
#   - { label: "Countries",       value: 12,    suffix: ""  }

# ── Языки ──────────────────────────────────────────────────────────────
# level: Native | Fluent | Conversational | Basic
languages:
  - { name: "English",  level: "Native"        }
  - { name: "Spanish",  level: "Conversational" }
  - { name: "Mandarin", level: "Basic"          }

# ── Навыки ─────────────────────────────────────────────────────────────
